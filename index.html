  :root {
    --bg: #180a1c; --flaeche: #26142c; --hover: #321c3a; --rand: #462c50;
    --rosa: #ff9ebf; --rosa2: #c2396f; --lila: #6a2c8c; --hell: #f6ecf6; --grau: #a892af; --dunkel: #280c22;
    --gold: #ffd27a; --silber: #dfe3ef; --bronze: #f0a774;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: Poppins, "Segoe UI", sans-serif; color: var(--hell); background: radial-gradient(1200px 500px at 50% -120px, rgba(194,57,111,.35), transparent 70%), var(--bg); min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }

  header { text-align: center; margin-bottom: 26px; position: relative; }
  .kopfleiste { position: absolute; right: 0; top: -8px; z-index: 30; }
  .klogin { display: inline-flex; align-items: center; gap: 6px; font-family: inherit; font-size: 12.5px; font-weight: 800; color: #fff; background: #9146ff; border: 0; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .klogin svg { width: 15px; height: 15px; fill: #fff; }
  .kchip { display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 12.5px; font-weight: 800; color: var(--hell); background: var(--flaeche); border: 1px solid var(--rand); border-radius: 999px; padding: 4px 10px 4px 4px; cursor: pointer; }
  .kchip .av { width: 26px; height: 26px; font-size: 11px; }
  .kmenue { position: absolute; right: 0; top: calc(100% + 6px); min-width: 200px; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 12px; padding: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.45); text-align: left; display: none; }
  .kmenue.offen { display: block; }
  .kmenue button { display: block; width: 100%; text-align: left; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--hell); background: none; border: 0; border-radius: 8px; padding: 9px 10px; cursor: pointer; }
  .kmenue button:hover { background: var(--hover); } .kmenue button.weg { color: #ff9aa8; }
  @media (max-width: 560px) { .kopfleiste { top: -18px; } .kchip .knm { display: none; } .kchip { padding: 3px; } .klogin span { display: none; } .klogin { padding: 7px; } }
  header .kl { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--rosa); }
  header h1 { font-size: clamp(30px, 7vw, 46px); font-weight: 800; line-height: 1.1; margin: 6px 0 8px; }
  header h1 span { color: var(--rosa); }
  header p { color: var(--grau); font-size: 14px; }
  header a { color: var(--rosa); text-decoration: none; font-weight: 700; }

  .reiter { display: flex; gap: 6px; background: var(--flaeche); padding: 5px; border-radius: 14px; margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .reiter::-webkit-scrollbar { display: none; }
  .reiter button { flex: 1 0 auto; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--hell); background: transparent; border: 0; border-radius: 10px; padding: 11px 9px; cursor: pointer; white-space: nowrap; }
  .reiter button:hover { background: var(--hover); }
  .reiter button.aktiv { background: var(--rosa); color: var(--dunkel); }

  .podest { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; margin-bottom: 22px; }
  .platz { background: var(--flaeche); border-radius: 16px; padding: 16px 10px 14px; text-align: center; position: relative; min-width: 0; }
  .platz.p1 { padding-top: 26px; background: linear-gradient(160deg, #c2396f, #5a2562); box-shadow: 0 10px 30px rgba(194,57,111,.35); }
  .platz .m { font-size: 24px; line-height: 1; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
  .platz { margin-top: 12px; }
  .platz .n { font-weight: 800; font-size: 15px; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .platz.p1 .n { font-size: 17px; }
  .platz .w { font-size: 13px; color: var(--grau); margin-top: 2px; }
  .platz.p1 .w { color: #ffd9e6; }

  .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; background: var(--lila); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: var(--hell); }
  .platz .av { width: 56px; height: 56px; font-size: 22px; margin: 8px auto 0; border: 3px solid var(--rand); display: flex; }
  .platz.p1 .av { width: 70px; height: 70px; border-color: var(--gold); }
  .platz.p2 .av { border-color: var(--silber); }
  .platz.p3 .av { border-color: var(--bronze); }
  .person { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .danke .av { width: 26px; height: 26px; font-size: 11px; }
  .danke .p { display: flex; align-items: center; gap: 8px; }
  .danke .p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bingo .zeile .w { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .bingo .av { width: 26px; height: 26px; font-size: 11px; }
  .suche { width: 100%; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--hell); background: var(--flaeche); border: 1px solid var(--rand); border-radius: 12px; padding: 11px 14px; outline: none; margin-bottom: 10px; }
  .suche:focus { border-color: var(--rosa); }

  .liste { background: var(--flaeche); border-radius: 16px; padding: 4px 14px; }
  .zeile { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rand); }
  .zeile:last-child { border-bottom: 0; }
  .zeile .r { font-weight: 800; color: var(--grau); }
  .zeile .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zeile .w { font-weight: 700; color: var(--rosa); white-space: nowrap; }
  .zeile.treffer { background: rgba(255,158,191,.12); border-radius: 10px; margin: 0 -8px; padding: 10px 8px; }
  .leer { color: var(--grau); text-align: center; padding: 22px 0; }

  .bingo .zeile { grid-template-columns: 1fr auto; }
  .bingo .zeile .n { color: var(--grau); font-weight: 600; }
  .bingo .zeile .w { color: var(--hell); }
  .bingo .zeile.neu .w { color: var(--gold); }
  .serie { background: linear-gradient(135deg, #c2396f, #5a2562); border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 12px; }
  .serie b { font-size: 20px; font-weight: 800; display: block; }
  .serie span { font-size: 13px; color: #ffd9e6; }
  .danke { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .danke .box { background: var(--flaeche); border-radius: 16px; padding: 14px; min-width: 0; }
  .danke h3 { font-size: 13px; letter-spacing: 1px; color: var(--rosa); margin-bottom: 8px; }
  .danke .p { padding: 6px 0; border-bottom: 1px solid var(--rand); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .danke .p:last-child { border-bottom: 0; }
  .danke .p i { font-style: normal; color: var(--grau); min-width: 24px; flex: 0 0 auto; }
  .danke-text { text-align: center; color: var(--grau); font-size: 14px; margin-bottom: 14px; }
  .live { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #c2396f, #5a2562); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; color: var(--hell); text-decoration: none; box-shadow: 0 8px 24px rgba(194,57,111,.3); }
  .live .punkt { width: 10px; height: 10px; border-radius: 50%; background: #ff3b5c; flex: 0 0 auto; animation: puls 1.4s infinite; }
  @keyframes puls { 0%,100% { box-shadow: 0 0 0 0 rgba(255,59,92,.7); } 50% { box-shadow: 0 0 0 7px rgba(255,59,92,0); } }
  .live .txt { min-width: 0; flex: 1; }
  .live b { display: block; font-size: 14px; }
  .live span { display: block; font-size: 12px; color: #ffd9e6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live .los { font-size: 12px; font-weight: 800; background: var(--hell); color: var(--dunkel); border-radius: 8px; padding: 6px 10px; white-space: nowrap; }

  .kacheln { display: grid; gap: 10px; }
  .emotes { grid-template-columns: repeat(5, 1fr); }
  .emote { background: var(--flaeche); border-radius: 16px; padding: 14px 8px 12px; text-align: center; position: relative; min-width: 0; }
  .emote.e1 { background: linear-gradient(160deg, #c2396f, #5a2562); }
  .emote img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 4px auto 8px; }

  }

  // Datenschutzerklärung
  function datenschutz() {
    var h = '<button class="zu" id="zu" aria-label="Schließen">×</button><div class="ds"><div class="kopf"><div><b>Datenschutzerklärung</b><div class="kk">Kazetopia · kazenity.github.io/kazetopia · Stand: November 2026</div></div></div>' +
      '<h4>1. VERANTWORTLICHER</h4><p>Giuseppe Auner (Kazenity). Kontaktdaten und Anschrift stehen im <a href="https://mein.online-impressum.de/kazenity/" target="_blank" rel="noopener">Impressum</a>.</p>' +
      '<h4>2. WAS DIESE SEITE IST</h4><p>Kazetopia ist eine Fan- und Community-Seite zum Twitch-Kanal twitch.tv/kazenity. Es gibt keine Pflicht-Anmeldung, keine Cookies, kein Tracking, keine Werbung und keine Analyse-Tools.</p>' +
      '<h4>3. HOSTING (GITHUB PAGES)</h4><p>Die Seite und ihre Daten werden über GitHub Pages bzw. raw.githubusercontent.com der GitHub, Inc. (88 Colin P Kelly Jr St, San Francisco, CA 94107, USA) ausgeliefert. Beim Aufruf verarbeitet GitHub technisch notwendige Daten wie deine IP-Adresse, Datum und Uhrzeit sowie Browser-Informationen, um die Seite auszuliefern und vor Missbrauch zu schützen. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an einer sicheren, funktionierenden Website). Eine Übermittlung in die USA ist möglich; GitHub ist nach dem EU-US Data Privacy Framework zertifiziert. Mehr: <a href="https://docs.github.com/de/site-policy/privacy-policies/github-general-privacy-statement" target="_blank" rel="noopener">Datenschutzerklärung von GitHub</a>.</p>' +
      '<h4>4. PROFILBILDER, CLIPS UND COVER</h4><p>Profilbilder, Clip-Vorschaubilder, Emotes und Spiele-Cover stammen ursprünglich von Twitch. Wir laden sie vorab selbst herunter und liefern sie als eigene Kopie über GitHub aus (siehe Punkt 3). Dein Browser baut beim Besuch der Seite <b>keine Verbindung zu Twitch</b> auf. Erst wenn du einen Link zu Twitch anklickst, gelten die Datenschutzbestimmungen von Twitch. Cover in der Spielesuche werden über unseren Server bei Supabase (Frankfurt) geladen und als Bilddaten mitgeschickt.</p>' +
      '<h4>5. SCHRIFTARTEN</h4><p>Die Schriftart ist direkt in die Seite eingebettet. Es findet keine Verbindung zu Google Fonts oder anderen Schrift-Anbietern statt.</p>' +
      '<h4>6. SPEICHER IM BROWSER</h4><p>Wenn du „Das bin ich“ wählst, wird dein Twitch-Name nur lokal in deinem Browser (localStorage) gespeichert, ebenso die Platzierungen deines letzten Besuchs für die ▲▼-Anzeige. Diese Daten verlassen dein Gerät nicht und können jederzeit über die Browser-Einstellungen gelöscht werden. Rechtsgrundlage ist § 25 Abs. 2 Nr. 2 TDDDG (vom Nutzer gewünschte Funktion).</p>' +
      '<h4>7. DARGESTELLTE COMMUNITY-DATEN</h4><p>Die Seite zeigt öffentliche Twitch-Namen und Profilbilder sowie Aktivitäts-Statistiken aus dem Stream (z. B. Watchtime, Chat-Nachrichten, Kanal-Währung, Erfolge). Spenden werden ohne Beträge nur als Namen angezeigt. Rechtsgrundlage ist Art. 6 Abs. 1 lit. f DSGVO (berechtigtes Interesse an einer Community-Rangliste). Wer nicht auf der Seite erscheinen möchte, kann jederzeit widersprechen: am einfachsten mit dem Befehl <b>!kazetopia aus</b> im Twitch-Chat (rückgängig mit <b>!kazetopia an</b>) oder formlos über die Kontaktdaten im Impressum. Der Eintrag wird dann ab der nächsten Aktualisierung nicht mehr angezeigt.</p>' +
      '<h4>7a. ANMELDUNG MIT TWITCH UND SPIELE-VOTING</h4><p>Wenn du den Voting-Bereich öffnest, werden Ergebnisse und Spielesuche von unserem Supabase-Server in Frankfurt geladen; dabei wird technisch deine IP-Adresse verarbeitet (Art. 6 Abs. 1 lit. f DSGVO). Für das Spiele-Voting kannst du dich freiwillig mit deinem Twitch-Konto anmelden. Dafür nutzen wir Supabase (Supabase, Inc., USA) mit Servern in Frankfurt (EU). Gespeichert werden dabei deine Twitch-Nutzer-ID, dein Twitch-Name, ggf. die bei Twitch hinterlegte E-Mail-Adresse (wird von Twitch beim Login übermittelt und nicht angezeigt oder genutzt), deine Vorschläge (sichtbar mit deinem Twitch-Namen) und deine Stimme (öffentlich wird nur die Gesamtzahl gezeigt, nicht wer wofür gestimmt hat). Wenn du dein Profil gestaltest, speichern wir zusätzlich deine Auswahl (Namensfarbe, Titel, Vitrinen-Abzeichen, Hintergrund) zusammen mit deinem Twitch-Namen; diese Auswahl ist auf deiner Profilkarte öffentlich sichtbar und kann jederzeit zurückgesetzt werden. Die Anmeldung wird in deinem Browser (localStorage) gemerkt, bis du dich abmeldest. Die Seite erhält keine Rechte auf dein Twitch-Konto. Rechtsgrundlage ist Art. 6 Abs. 1 lit. b DSGVO (Nutzung der von dir gewünschten Funktion). Vor der Anmeldung wirst du über diese Punkte informiert und bestätigst sie. Über den Knopf „Meine Daten löschen“ kannst du dein Konto samt Stimme und Vorschlägen jederzeit selbst sofort und endgültig löschen; alternativ genügt eine kurze Nachricht über die Kontaktdaten im Impressum. Mehr: <a href="https://supabase.com/privacy" target="_blank" rel="noopener">Datenschutzerklärung von Supabase</a>.</p>' +
      '<h4>8. EXTERNE LINKS</h4><p>Links zu Twitch, Discord, YouTube, TikTok und Instagram führen zu Angeboten anderer Anbieter. Erst beim Anklicken gelten deren Datenschutzbestimmungen.</p>' +
      '<h4>9. DEINE RECHTE</h4><p>Du hast das Recht auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Widerspruch (Art. 15–21 DSGVO) sowie auf Beschwerde bei einer Datenschutz-Aufsichtsbehörde, z. B. dem Hessischen Beauftragten für Datenschutz und Informationsfreiheit.</p></div>';
    karteOeffnen(h);
    try { history.replaceState(null, '', '#datenschutz'); } catch (x) { }
  }
  $('dslink').onclick = function (e) { e.preventDefault(); datenschutz(); };

  function profilZu() { $('kartebg').className = 'karte-bg'; try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (x) { } }
  $('kartebg').onclick = function (e) { if (e.target === this) profilZu(); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') profilZu(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('#infoknopf')) { uebersicht(); return; }
    var c = e.target.closest('.ichips button');
    if (c) {
      var box = c.parentNode.parentNode, id = c.getAttribute('data-sek');
      Array.prototype.forEach.call(c.parentNode.children, function (b) { b.className = b === c ? 'aktiv' : ''; });
      Array.prototype.forEach.call(box.querySelectorAll('.isek'), function (d) { d.style.display = d.getAttribute('data-sek') === id ? '' : 'none'; });
      return;
    }
    var t = e.target.closest('[data-l]');
    if (!t || t.closest('#karte')) return;
    profilZeigen(t.getAttribute('data-l'));
  });
  function wert(w) {
    if (reiter === 'watchtime') return Number(w).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Std.';
    if (reiter === 'chat') return Number(w).toLocaleString('de-DE') + ' Nachr.';
    return Number(w).toLocaleString('de-DE') + ' Zeni';
  }

  function sonder() {
    var spezial = reiter === 'start' || reiter === 'bingo' || reiter === 'danke' || reiter === 'emotes' || reiter === 'clips' || reiter === 'spiele';
    $('podest').style.display = spezial ? 'none' : '';
    $('suche').style.display = spezial ? 'none' : '';
    if (!spezial) { $('liste').className = 'liste'; return false; }
    if (reiter === 'start') { $('liste').className = ''; $('liste').innerHTML = startHtml(); startEvents(); $('hinweis').textContent = ''; return true; }
    if (reiter === 'emotes') {
      var em = daten.emotes || [];
      var he = '';
      function kachel(x, i) {
        return '<div class="emote' + (i === 0 ? ' e1' : '') + '"><div class="rg">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : '#' + (i + 1)) + '</div><img loading="lazy" alt="' + esc(x.n) + '" src="' + esc(sicher(x.b)) + '"><div class="n">' + esc(x.n) + '</div><div class="w">' + Number(x.w).toLocaleString('de-DE') + '×</div></div>';
      }
      if (em.length) {
        he += '<div class="kacheln emotes top3">';
        [1, 0, 2].forEach(function (i) { he += em[i] ? kachel(em[i], i) : '<div></div>'; });
        he += '</div>';
        if (em.length > 3) {
          he += '<div class="kacheln emotes rest">';
          for (var k = 3; k < em.length; k++) he += kachel(em[k], k);
          he += '</div>';
        }
      }
      $('liste').className = '';
      $('liste').innerHTML = em.length ? he : '<div class="liste"><div class="leer">Noch keine Emote-Daten.</div></div>';
      $('hinweis').textContent = 'Alle ' + em.length + ' Kanal-Emotes, sortiert nach Beliebtheit im Chat';
      return true;
    }
    if (reiter === 'clips') {
      var c = daten.clips || {};
      var hc = '';
      if (c.woche) hc += '<div class="serie"><b>🎬 Clipper der Woche: ' + esc(prof(c.woche.name).n) + '</b><span>' + c.woche.anzahl + (c.woche.anzahl == 1 ? ' Clip' : ' Clips') + ' seit Sonntag, ' + esc(c.woche.seit) + ' · Clippt mit !clip mit!</span></div>';
      var zeitraeume = [['woche', 'Diese Woche', c.wocheTop], ['monat', 'Letzte 30 Tage', c.monat], ['top', 'Alle Zeiten', c.top]];
      hc += '<div class="schalter" id="schalter">';
      zeitraeume.forEach(function (z) { hc += '<button data-z="' + z[0] + '"' + (z[0] === clipZeit ? ' class="aktiv"' : '') + '>' + z[1] + '</button>'; });
      hc += '</div>';
      var tc = (clipZeit === 'woche' ? c.wocheTop : clipZeit === 'top' ? c.top : c.monat) || [];
      if (tc.length) {
        hc += '<div class="kacheln clips">';
        tc.forEach(function (x, i) {
          hc += '<a class="clip" href="' + esc(x.url) + '" target="_blank" rel="noopener"><div class="vb"><img loading="lazy" alt="" src="' + esc(sicher(x.bild)) + '"><i>#' + (i + 1) + '</i><u>▶ ' + Number(x.aufrufe).toLocaleString('de-DE') + '</u></div><div class="t"><b>' + esc(x.titel) + '</b><span>von ' + esc(prof(x.von).n) + (x.datum ? ' · ' + esc(x.datum) : '') + '</span></div></a>';
        });
        hc += '</div>';
      } else hc += '<div class="liste"><div class="leer">In diesem Zeitraum gibt es noch keine Clips.</div></div>';
      $('liste').className = '';
      $('liste').innerHTML = hc;
      $('schalter').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        clipZeit = b.getAttribute('data-z');
        zeigen();
      };
      $('hinweis').textContent = 'Die meistgesehenen Clips · ' + (clipZeit === 'woche' ? 'seit Sonntag' : clipZeit === 'top' ? 'aller Zeiten' : 'der letzten 30 Tage');
      return true;
    }
    if (reiter === 'spiele') {
      var sw = '<div class="schalter" id="spschalter"><button data-s="voting"' + (spieleAnsicht === 'voting' ? ' class="aktiv"' : '') + '>✨ Voting</button><button data-s="liste"' + (spieleAnsicht === 'liste' ? ' class="aktiv"' : '') + '>⭐ Bewertungen</button></div>';
      if (spieleAnsicht === 'voting') {
        $('liste').className = '';
        $('liste').innerHTML = sw + votingHtml();
        $('spschalter').onclick = function (e) { var b = e.target.closest('button'); if (b) { spieleAnsicht = b.getAttribute('data-s'); zeigen(); } };
        votingEvents();
        $('hinweis').textContent = 'Community-Voting für das nächste Story-Game';
        return true;
      }
      var sp = daten.spiele || [];
      var hs = '';
      sp.forEach(function (x) {
        hs += '<div class="spiel">' + (x.live ? '<div class="lv">● LIVE</div>' : '') + '<div class="cv">' + (sicher(x.b) ? '<img loading="lazy" alt="" src="' + esc(sicher(x.b)) + '">' : '🎮') + '</div><div class="t"><b title="' + esc(x.n) + '">' + esc(x.n) + '</b>' + (x.r ? '<span class="rt">⭐ ' + esc(x.r) + '</span>' : '<span class="rt laeuft">▶ Läuft gerade</span>') + (x.link ? '<br><a class="yt" href="' + esc(x.link) + '" target="_blank" rel="noopener">▶ YouTube</a>' : '') + '</div></div>';
      });
      $('liste').className = '';
      $('liste').innerHTML = sw + (sp.length ? '<div class="kacheln spiele">' + hs + '</div>' : '<div class="liste"><div class="leer">Noch keine Spiele eingetragen.</div></div>');
      $('spschalter').onclick = function (e) { var b = e.target.closest('button'); if (b) { spieleAnsicht = b.getAttribute('data-s'); zeigen(); } };
      $('hinweis').textContent = 'Unsere Story-Games mit Kazes Bewertung';
      return true;
    }
    if (reiter === 'bingo') {
      var b = daten.bingo || [];
      var h = '';
      if (b.length) {
        var serie = 1;
        for (var i = 1; i < b.length && b[i].name === b[0].name; i++) serie++;
        if (serie >= 2) h += '<div class="serie"><b>👑 ' + esc(b[0].name) + '</b><span>gewinnt das Bingo ' + serie + ' Monate in Folge · Wer schlägt ' + esc(b[0].name) + '?</span></div>';
      }
      h += '<div class="liste">';
      if (!b.length) h += '<div class="leer">Noch keine Bingo-Gewinner eingetragen.</div>';
      b.forEach(function (x, i) { h += '<div class="zeile' + (i === 0 ? ' neu' : '') + '"' + dl(x.name) + '><div class="n">' + esc(x.monat) + '</div><div class="w">' + (i === 0 ? '🏆 ' : '') + bild(x.name) + '<span>' + esc(prof(x.name).n) + '</span></div></div>'; });
      h += '</div>';
      $('liste').className = 'bingo';
      $('liste').innerHTML = h;
      $('hinweis').textContent = 'Jeden Monat Stream-Bingo mitspielen – der Gewinner landet hier.';
    } else {
      var d = daten.danke || {};
      function spalte(t, arr) {
        var s = '<div class="box"><h3>' + t + '</h3>';
        if (!arr || !arr.length) s += '<div class="leer">–</div>';
        (arr || []).forEach(function (n, i) { s += '<div class="p"' + dl(n) + '><i>' + (i + 1) + '.</i>' + bild(n) + '<span>' + esc(prof(n).n) + '</span></div>'; });
        return s + '</div>';
      }
      $('liste').className = '';
      $('liste').innerHTML = '<div class="danke-text">Danke an alle, die den Kanal unterstützen 🌸</div><div class="danke">' +
        spalte('💸 SPENDEN', d.spenden) + spalte('🎁 GIFT SUBS', d.gifts) + spalte('🔔 BITS', d.bits) + '</div>';
      $('hinweis').textContent = 'Die größten Unterstützer aller Zeiten';
    }
    return true;
  }

  var untertitel = {
    start: 'Die Community von Kaze auf einen Blick',
    zeni: 'Wer hat die meisten Zeni?',
    watchtime: 'Wer schaut am längsten zu?',
    bingo: 'Wer hat das Stream-Bingo gewonnen?',
    chat: 'Wer schreibt am meisten im Chat?',
    danke: 'Die größten Unterstützer des Kanals',
    emotes: 'Welche Emotes lieben wir am meisten?',
    clips: 'Die besten Momente aus dem Stream',
    spiele: 'Was spielen wir als Nächstes? Stimm mit ab!'
  };
  function zeigen() {
    $('unter').textContent = untertitel[reiter] || '';
    if (!daten) return;
    var mitMonat = (reiter === 'watchtime' || reiter === 'chat') && daten.monat;
    $('zeitwahl').style.display = mitMonat ? '' : 'none';
    if (mitMonat) $('zeitwahl').innerHTML = '<button data-m="0"' + (monatsModus ? '' : ' class="aktiv"') + '>Gesamt</button><button data-m="1"' + (monatsModus ? ' class="aktiv"' : '') + '>' + esc(daten.monat.name || 'Dieser Monat') + '</button>';
    if (sonder()) { ichLeiste(null); seiteZeigen(); return; }
    var monat = mitMonat && monatsModus;
    var l = (monat ? daten.monat[reiter] : daten[reiter]) || [];
    var such = $('suche').value.trim().toLowerCase();
    var medaillen = ['🥇', '🥈', '🥉'];
    var reihen = [1, 0, 2];
    var p = '';
    reihen.forEach(function (i) {
      var x = l[i];
      if (!x) { p += '<div></div>'; return; }
      p += '<div class="platz p' + (i + 1) + '"' + dl(x.n) + '><div class="m">' + medaillen[i] + '</div>' + bild(x.n, true) + '<div class="n"' + fs(x.n) + '>' + esc(prof(x.n).n) + '</div><div class="w">' + wert(x.w) + '</div></div>';
    });
    $('podest').innerHTML = p;

    var h = '', gefunden = 0, schluessel = reiter + (monat ? '_m' : ''), alt = vorher[schluessel] || null;
    l.forEach(function (x, i) {
      if (i < 3 && !such) return;
      if (!such && !alleZeigen && i >= 25) return;
      var treffer = such && (x.n.toLowerCase().indexOf(such) >= 0 || String(prof(x.n).n).toLowerCase().indexOf(such) >= 0);
      if (such && !treffer) return;
      gefunden++;
      var lg = String(x.n).toLowerCase(), zus = '', pwH = '';
      if (alt) { var vp = alt[lg]; if (vp && vp !== i + 1) pwH = '<i class="pw ' + (vp > i + 1 ? 'hoch">▲' + (vp - i - 1) : 'runter">▼' + (i + 1 - vp)) + '</i>'; else if (!vp && Object.keys(alt).length) pwH = '<i class="pw hoch">neu</i>'; }
      h += '<div class="zeile' + (treffer ? ' treffer' : '') + (lg === ich ? ' treffer' : '') + '"' + dl(x.n) + '><div class="r">#' + (i + 1) + pwH + '</div><div class="n">' + person(x.n, zus) + '</div><div class="w">' + wert(x.w) + '</div></div>';
    });
    if (such && daten.spieler) {
      // Profile auch für Leute außerhalb der Top 100 finden
      var extra = [];
      Object.keys(daten.spieler).forEach(function (k) {
        if (extra.length >= 8) return;
        var n = String(prof(k).n || k).toLowerCase();
        if ((k.indexOf(such) >= 0 || n.indexOf(such) >= 0) && !l.some(function (x) { return String(x.n).toLowerCase() === k; })) extra.push(k);
      });
      extra.forEach(function (k) { h += '<div class="zeile"' + dl(k) + '><div class="r">👤</div><div class="n">' + person(k) + '</div><div class="w profil-link">Profil ›</div></div>'; });
    }
    if (!h) h = '<div class="leer">' + (such ? 'Niemand mit diesem Namen gefunden.' : 'Noch keine Daten.') + '</div>';
    if (!such && !alleZeigen && l.length > 25) h += '<button class="mehr-btn" id="mehrbtn">Weitere ' + (l.length - 25) + ' anzeigen ▾</button>';
    $('liste').innerHTML = h;
    if ($('mehrbtn')) $('mehrbtn').onclick = function (e) { e.stopPropagation(); alleZeigen = true; zeigen(); };
    ichLeiste(l, monat);
    seiteZeigen();
    if (monat) { $('hinweis').textContent = 'Zuwachs seit dem 1. ' + (daten.monat.name || '') + ' · Top ' + l.length + (reiter === 'chat' && daten.monat.name === 'November' ? ' · Chat wird im November erst ab dem 4. gezählt' : ''); return; }
    $('hinweis').textContent = reiter === 'chat' && daten.chatGesamt ? 'Insgesamt ' + Number(daten.chatGesamt).toLocaleString('de-DE') + ' Chat-Nachrichten · gezählt von StreamElements' : 'Top ' + l.length;
  }

  $('reiter').onclick = function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    reiter = b.getAttribute('data-r'); alleZeigen = false;
    Array.prototype.forEach.call(this.children, function (x) { x.className = x === b ? 'aktiv' : ''; });
    try { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } catch (x) { }
    zeigen();
  };
  $('suche').oninput = zeigen;
  $('ichbar').onclick = function () { if (ich) profilZeigen(ich); };
  $('zeitwahl').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; monatsModus = b.getAttribute('data-m') === '1'; zeigen(); };

  // Daten direkt aus dem Repo laden (ohne auf den Neubau von GitHub Pages zu warten), sonst die Kopie der Seite
  function datenLaden() {
    return fetch('https://raw.githubusercontent.com/Kazenity/kazetopia/main/daten.json?t=' + Date.now())
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .catch(function () { return fetch('daten.json?t=' + Date.now()).then(function (r) { return r.json(); }); });
  }
  datenLaden().then(function (d) {
    daten = d;
    plaetzeMerken(d);
    kopfleiste();
    if (sitzung) nutzerLaden().then(function () { kopfleiste(); zeigen(); });
    Array.prototype.forEach.call($('reiter').children, function (x) { x.className = x.getAttribute('data-r') === reiter ? 'aktiv' : ''; });
    $('stand').textContent = 'Stand: ' + (d.stand || '–');
    if (d.live && d.live.an) {
      $('live').innerHTML = '<div class="punkt"></div><div class="txt"><b>Kaze ist gerade live' + (d.live.spiel ? ' · ' + esc(d.live.spiel) : '') + '</b><span>' + esc(d.live.titel || '') + '</span></div><div class="los">Zuschauen</div>';
      $('live').style.display = 'flex';
    }
    zeigen();
    if (location.hash === '#datenschutz') datenschutz();
    var m = location.hash.match(/^#profil=(.+)$/);
    if (m) profilZeigen(decodeURIComponent(m[1]).toLowerCase());
  }).catch(function () { $('liste').innerHTML = '<div class="leer">Rangliste konnte nicht geladen werden.</div>'; });
})();
</script>
