<style>

  .emotes { grid-template-columns: repeat(5, 1fr); }

  .emote.e1 { background: linear-gradient(160deg, #c2396f, #5a2562); }
  .emote img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 4px auto 8px; }
  .emote .rg { position: absolute; top: 8px; left: 10px; font-size: 12px; font-weight: 800; color: var(--grau); }
  .emote.e1 .rg { color: #ffd9e6; }
  .emote .n { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emote .w { font-size: 12px; color: var(--rosa); font-weight: 700; }

  .clips { grid-template-columns: repeat(3, 1fr); }
  .schalter { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }

  .schalter button.aktiv { background: var(--rosa); color: var(--dunkel); border-color: var(--rosa); }
  .emotes.top3 { grid-template-columns: 1fr 1.15fr 1fr; align-items: end; margin-bottom: 10px; }

  .emotes.top3 .emote .w { font-size: 13px; }
  .emotes.rest { grid-template-columns: repeat(6, 1fr); }

  .emotes.rest .emote img { width: 44px; height: 44px; margin: 6px auto 6px; }
  .emotes.rest .emote .rg { top: 6px; left: 8px; font-size: 10.5px; }

  .spiel .rt { display: inline-block; margin-top: 3px; font-size: 13px; font-weight: 800; color: var(--gold); }
  .spiel .rt.laeuft { color: var(--rosa); }
  .clip { background: var(--flaeche); border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--hell); display: block; min-width: 0; transition: transform .15s; }
  .clip:hover { transform: translateY(-2px); background: var(--hover); }
  .clip .vb { position: relative; aspect-ratio: 16 / 9; background: var(--dunkel); }
  .clip .vb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip .vb i { position: absolute; left: 8px; top: 8px; font-style: normal; font-size: 11px; font-weight: 800; background: rgba(0,0,0,.65); border-radius: 6px; padding: 2px 7px; }
  .clip .vb u { position: absolute; right: 8px; bottom: 8px; text-decoration: none; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.65); border-radius: 6px; padding: 2px 7px; }
  .clip .t { padding: 9px 11px 11px; }
  .clip .t b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .t span { font-size: 11.5px; color: var(--grau); }

  .spiele { grid-template-columns: repeat(4, 1fr); }

  .spiel .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .spiel .t { padding: 8px 10px 10px; }
  .spiel .t b { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spiel .t span { font-size: 11.5px; color: var(--grau); }
  .spiel .yt { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 800; color: var(--dunkel); background: var(--rosa); border-radius: 7px; padding: 3px 8px; text-decoration: none; }
  .spiel .lv { position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 800; background: #ff3b5c; color: #fff; border-radius: 6px; padding: 2px 7px; }
  .socials { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 26px; }
  .socials a { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--hell); text-decoration: none; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 999px; padding: 8px 14px; }
  .socials a:hover { border-color: var(--rosa); color: var(--rosa); }
  .socials svg { width: 16px; height: 16px; fill: currentColor; }
  footer { text-align: center; color: var(--grau); font-size: 12px; margin-top: 22px; line-height: 1.7; }
  [data-l] { cursor: pointer; }
  .zeile[data-l]:hover, .danke .p[data-l]:hover { background: rgba(255,158,191,.07); border-radius: 10px; }
  .karte-bg { position: fixed; inset: 0; background: rgba(10,4,12,.72); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }

  .karte { width: 100%; max-width: 460px; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 20px; padding: 22px 20px 18px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .karte .zu { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--grau); font-size: 24px; cursor: pointer; line-height: 1; }

  .kachel .balken i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rosa2), var(--rosa)); }
  .kachel .kn { font-size: 11px; color: var(--grau); margin-top: 5px; line-height: 1.35; }
  .naechste div { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; font-weight: 700; padding: 7px 10px; background: var(--bg); border-radius: 10px; margin-bottom: 6px; }

      h += '</div><div class="syminfo" id="syminfo">Tippe auf ein Symbol für Details</div>';
    }

    // Ränge als 2×2-Kacheln (Details unter „Alle Erfolge anzeigen“)
    h += '<h4>🏅 RÄNGE</h4><div class="kacheln4">';
    GROSS.forEach(function (g) { if (wertVon(sp, g.k) > 0) h += grossKachel(g, sp); });
    h += '</div>';

    // freigeschaltete kleine Erfolge kompakt
    var kleinHat = KLEIN.filter(function (e) { return wertVon(sp, e.k) > 0 && kleinInfo(e, wertVon(sp, e.k)).farbe; });
    if (kleinHat.length) {
      h += '<h4>🎨 ERFOLGE</h4><div class="abz">';
      kleinHat.forEach(function (e) { var ki = kleinInfo(e, wertVon(sp, e.k)); h += '<span>' + e.icon + ' ' + e.titel + ' · ' + ki.farbe[0] + ' ' + ki.farbe[1] + (ki.extra ? ' ✦' + ki.extra : '') + '</span>'; });
      h += '</div>';
    }

    // Als Nächstes: die 3 nächsten Ziele (größter Fortschritt)
    var ziele = [];
    KLEIN.forEach(function (e) { var v = wertVon(sp, e.k); if (v > 0) { var ki = kleinInfo(e, v); ziele.push({ p: (v - ki.vorher) / Math.max(1, ki.ziel - ki.vorher), kurz: e.icon + ' ' + e.titel + ' ' + ki.nxFarbe[0] + ' ' + ki.nxFarbe[1] + ' <span>noch ' + zahl(ki.ziel - v) + ' ' + e.einheit + '</span>' }); } });
    if (!hatAbzeichen(sp, 'og')) { var pOg = Math.min((sp.w || 0) / 500, sp.f ? tageSeit(sp.f) / 730 : 0); ziele.push({ p: pOg, kurz: '👑 OG-Abzeichen <span>2 Jahre + 500 Std.</span>' }); }
    ziele.sort(function (a, b) { return b.p - a.p; });
    if (ziele.length) {
      h += '<h4>🎯 ALS NÄCHSTES</h4><div class="naechste">';
      ziele.slice(0, 3).forEach(function (z) { h += '<div>' + z.kurz + '</div>'; });
      h += '</div>';
    }

    // Alle Erfolge (aufklappbar)
    h += '<button class="aufklapp" id="aufklapp">Alle Erfolge anzeigen ▾</button><div id="alle" style="display:none">';
    h += '<h4>RÄNGE</h4>'; GROSS.forEach(function (g) { h += grossZeile(g, sp); });
    h += '<h4>ERFOLGE</h4>'; KLEIN.forEach(function (e) { h += kleinZeile(e, sp); });
    h += '<h4>ABZEICHEN</h4><div class="liste-abz">';
    ABZEICHEN.forEach(function (a) { var ja = hatAbzeichen(sp, a.id); h += '<div class="' + (ja ? '' : 'aus') + '">' + a.icon + ' <b>' + a.name + '</b> – ' + a.text + (ja ? ' ✓' : '') + '</div>'; });
    h += '</div></div>';
    karteOeffnen(h);
    $('aufklapp').onclick = function () { var a = $('alle'); var zu = a.style.display === 'none'; a.style.display = zu ? '' : 'none'; this.textContent = zu ? 'Weniger anzeigen ▴' : 'Alle Erfolge anzeigen ▾'; };
    Array.prototype.forEach.call(document.querySelectorAll('#karte .sym'), function (el) { el.onclick = function () { $('syminfo').textContent = el.getAttribute('data-info'); }; });
  }
  function karteOeffnen(h) {
    $('karte').innerHTML = h;
    $('kartebg').className = 'karte-bg offen';
    $('zu').onclick = profilZu;
    $('karte').scrollTop = 0;
  }

  // ℹ️ Übersicht: alle Ränge, Erfolge und Abzeichen
  function uebersicht() {
    var h = '<button class="zu" id="zu" aria-label="Schließen">×</button><div class="kopf"><div><b>Wie bekomme ich Erfolge?</b><div class="kk">Klick auf einen Namen zeigt dessen Profil. Alles wird automatisch gezählt.</div></div></div>';
    GROSS.forEach(function (g) {
      h += '<h4>' + g.icon + ' ' + g.titel.toUpperCase() + ' · ' + g.anime.toUpperCase() + '</h4><div class="un erkl">' + g.text + '</div><div class="tab">';
      g.leiter.forEach(function (x) { h += '<div><span>' + x[1] + ' ' + esc(x[2]) + '</span><span>' + g.fmt(x[0]) + '</span></div>'; });
      h += '</div>';
    });
    h += '<h4>🎨 ERFOLGE · ' + FARBEN.map(function (f) { return f[0]; }).join(' ') + '</h4><div class="un erkl">Stufen: ' + FARBEN.map(function (f) { return f[1]; }).join(' → ') + '</div>';
    KLEIN.forEach(function (e) {
      h += '<div class="erfolg"><div class="ob">' + e.icon + ' ' + e.titel + '</div><div class="un erkl">' + e.text + '</div><div class="un">' + e.stufen.map(function (x, i) { return FARBEN[i][0] + ' ' + zahl(x); }).join(' · ') + '</div></div>';
    });
    h += '<h4>✨ ABZEICHEN</h4><div class="liste-abz">';
    ABZEICHEN.forEach(function (a) { h += '<div>' + a.icon + ' <b>' + a.name + '</b> – ' + a.text + '</div>'; });
    Object.keys(EVENTS).forEach(function (c) { var e = EVENTS[c]; h += '<div>' + e[0] + ' <b>' + e[1] + '</b> – ' + e[2] + '</div>'; });
    h += '</div><div class="un erkl" style="margin-top:10px">Ganz große Erfolge werden live im Chat gefeiert 🏅</div>';
    karteOeffnen(h);
  }

  function profilZu() { $('kartebg').className = 'karte-bg'; }
  $('kartebg').onclick = function (e) { if (e.target === this) profilZu(); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') profilZu(); });
  document.addEventListener('click', function (e) {
    if (e.target.closest('#infoknopf')) { uebersicht(); return; }
    var t = e.target.closest('[data-l]');
    if (!t || t.closest('#karte')) return;
    profilZeigen(t.getAttribute('data-l'));
  });
  function wert(w) {
    if (reiter === 'watchtime') return Number(w).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Std.';
    if (reiter === 'chat') return Number(w).toLocaleString('de-DE') + ' Nachr.';
    return Number(w).toLocaleString('de-DE') + ' Zeni';
  }

  function sonder() {
    var spezial = reiter === 'bingo' || reiter === 'danke' || reiter === 'emotes' || reiter === 'clips' || reiter === 'spiele';
    $('podest').style.display = spezial ? 'none' : '';
    $('suche').style.display = spezial ? 'none' : '';
    if (!spezial) { $('liste').className = 'liste'; return false; }
    if (reiter === 'emotes') {
      var em = daten.emotes || [];
      var he = '';
      function kachel(x, i) {
        return '<div class="emote' + (i === 0 ? ' e1' : '') + '"><div class="rg">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : '#' + (i + 1)) + '</div><img loading="lazy" alt="' + esc(x.n) + '" src="' + esc(x.b) + '"><div class="n">' + esc(x.n) + '</div><div class="w">' + Number(x.w).toLocaleString('de-DE') + '×</div></div>';
      }
      if (em.length) {
        he += '<div class="kacheln emotes top3">';
        [1, 0, 2].forEach(function (i) { he += em[i] ? kachel(em[i], i) : '<div></div>'; });
        he += '</div>';
        if (em.length > 3) {
          he += '<div class="kacheln emotes rest">';
          for (var k = 3; k < em.length; k++) he += kachel(em[k], k);
          he += '</div>';
        }
      }
      $('liste').className = '';
      $('liste').innerHTML = em.length ? he : '<div class="liste"><div class="leer">Noch keine Emote-Daten.</div></div>';
      $('hinweis').textContent = 'Alle ' + em.length + ' Kanal-Emotes, sortiert nach Beliebtheit im Chat';
      return true;
    }
    if (reiter === 'clips') {
      var c = daten.clips || {};
      var hc = '';
      if (c.woche) hc += '<div class="serie"><b>🎬 Clipper der Woche: ' + esc(prof(c.woche.name).n) + '</b><span>' + c.woche.anzahl + (c.woche.anzahl == 1 ? ' Clip' : ' Clips') + ' seit Sonntag, ' + esc(c.woche.seit) + ' · Clippt mit !clip mit!</span></div>';
      var zeitraeume = [['woche', 'Diese Woche', c.wocheTop], ['monat', 'Letzte 30 Tage', c.monat], ['top', 'Alle Zeiten', c.top]];
      hc += '<div class="schalter" id="schalter">';
      zeitraeume.forEach(function (z) { hc += '<button data-z="' + z[0] + '"' + (z[0] === clipZeit ? ' class="aktiv"' : '') + '>' + z[1] + '</button>'; });
      hc += '</div>';
      var tc = (clipZeit === 'woche' ? c.wocheTop : clipZeit === 'top' ? c.top : c.monat) || [];
      if (tc.length) {
        hc += '<div class="kacheln clips">';
        tc.forEach(function (x, i) {
          hc += '<a class="clip" href="' + esc(x.url) + '" target="_blank" rel="noopener"><div class="vb"><img loading="lazy" alt="" src="' + esc(x.bild) + '"><i>#' + (i + 1) + '</i><u>▶ ' + Number(x.aufrufe).toLocaleString('de-DE') + '</u></div><div class="t"><b>' + esc(x.titel) + '</b><span>von ' + esc(prof(x.von).n) + (x.datum ? ' · ' + esc(x.datum) : '') + '</span></div></a>';
        });
        hc += '</div>';
      } else hc += '<div class="liste"><div class="leer">In diesem Zeitraum gibt es noch keine Clips.</div></div>';
      $('liste').className = '';
      $('liste').innerHTML = hc;
      $('schalter').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        clipZeit = b.getAttribute('data-z');
        zeigen();
      };
      $('hinweis').textContent = 'Die meistgesehenen Clips · ' + (clipZeit === 'woche' ? 'seit Sonntag' : clipZeit === 'top' ? 'aller Zeiten' : 'der letzten 30 Tage');
      return true;
    }
    if (reiter === 'spiele') {
      var sp = daten.spiele || [];
      var hs = '';
      sp.forEach(function (x) {
        hs += '<div class="spiel">' + (x.live ? '<div class="lv">● LIVE</div>' : '') + '<div class="cv">' + (x.b ? '<img loading="lazy" alt="" src="' + esc(x.b) + '">' : '🎮') + '</div><div class="t"><b title="' + esc(x.n) + '">' + esc(x.n) + '</b>' + (x.r ? '<span class="rt">⭐ ' + esc(x.r) + '</span>' : '<span class="rt laeuft">▶ Läuft gerade</span>') + (x.link ? '<br><a class="yt" href="' + esc(x.link) + '" target="_blank" rel="noopener">▶ YouTube</a>' : '') + '</div></div>';
      });
      $('liste').className = '';
      $('liste').innerHTML = sp.length ? '<div class="kacheln spiele">' + hs + '</div>' : '<div class="liste"><div class="leer">Noch keine Spiele eingetragen.</div></div>';
      $('hinweis').textContent = 'Unsere Story-Games mit Kazes Bewertung';
      return true;
    }
    if (reiter === 'bingo') {
      var b = daten.bingo || [];
      var h = '';
      if (b.length) {
        var serie = 1;
        for (var i = 1; i < b.length && b[i].name === b[0].name; i++) serie++;
        if (serie >= 2) h += '<div class="serie"><b>👑 ' + esc(b[0].name) + '</b><span>gewinnt das Bingo ' + serie + ' Monate in Folge · Wer schlägt ' + esc(b[0].name) + '?</span></div>';
      }
      h += '<div class="liste">';
      if (!b.length) h += '<div class="leer">Noch keine Bingo-Gewinner eingetragen.</div>';
      b.forEach(function (x, i) { h += '<div class="zeile' + (i === 0 ? ' neu' : '') + '"' + dl(x.name) + '><div class="n">' + esc(x.monat) + '</div><div class="w">' + (i === 0 ? '🏆 ' : '') + bild(x.name) + '<span>' + esc(prof(x.name).n) + '</span></div></div>'; });
      h += '</div>';
      $('liste').className = 'bingo';
      $('liste').innerHTML = h;
      $('hinweis').textContent = 'Jeden Monat Stream-Bingo mitspielen – der Gewinner landet hier.';
    } else {
      var d = daten.danke || {};
      function spalte(t, arr) {
        var s = '<div class="box"><h3>' + t + '</h3>';
        if (!arr || !arr.length) s += '<div class="leer">–</div>';
        (arr || []).forEach(function (n, i) { s += '<div class="p"' + dl(n) + '><i>' + (i + 1) + '.</i>' + bild(n) + '<span>' + esc(prof(n).n) + '</span></div>'; });
        return s + '</div>';
      }
      $('liste').className = '';
      $('liste').innerHTML = '<div class="danke-text">Danke an alle, die den Kanal unterstützen 🌸</div><div class="danke">' +
        spalte('💸 SPENDEN', d.spenden) + spalte('🎁 GIFT SUBS', d.gifts) + spalte('🔔 BITS', d.bits) + '</div>';
      $('hinweis').textContent = 'Die größten Unterstützer aller Zeiten';
    }
    return true;
  }

  var untertitel = {
    zeni: 'Wer hat die meisten Zeni?',
    watchtime: 'Wer schaut am längsten zu?',
    bingo: 'Wer hat das Stream-Bingo gewonnen?',
    chat: 'Wer schreibt am meisten im Chat?',
    danke: 'Die größten Unterstützer des Kanals',
    emotes: 'Welche Emotes lieben wir am meisten?',
    clips: 'Die besten Momente aus dem Stream',
    spiele: 'Welche Story-Games haben wir schon gespielt?'
  };
  function zeigen() {
    $('unter').textContent = untertitel[reiter] || '';
    if (!daten) return;
    if (sonder()) return;
    var l = daten[reiter] || [];
    var such = $('suche').value.trim().toLowerCase();
    var medaillen = ['🥇', '🥈', '🥉'];
    var reihen = [1, 0, 2];
    var p = '';
    reihen.forEach(function (i) {
      var x = l[i];
      if (!x) { p += '<div></div>'; return; }
      p += '<div class="platz p' + (i + 1) + '"' + dl(x.n) + '><div class="m">' + medaillen[i] + '</div>' + bild(x.n, true) + '<div class="n">' + esc(prof(x.n).n) + '</div><div class="w">' + wert(x.w) + '</div></div>';
    });
    $('podest').innerHTML = p;

    var h = '', gefunden = 0;
    l.forEach(function (x, i) {
      if (i < 3 && !such) return;
      var treffer = such && (x.n.toLowerCase().indexOf(such) >= 0 || String(prof(x.n).n).toLowerCase().indexOf(such) >= 0);
      if (such && !treffer) return;
      gefunden++;
      h += '<div class="zeile' + (treffer ? ' treffer' : '') + '"' + dl(x.n) + '><div class="r">#' + (i + 1) + '</div><div class="n">' + person(x.n) + '</div><div class="w">' + wert(x.w) + '</div></div>';
    });
    if (such && daten.spieler) {
      // Profile auch für Leute außerhalb der Top 100 finden
      var extra = [];
      Object.keys(daten.spieler).forEach(function (k) {
        if (extra.length >= 8) return;
        var n = String(prof(k).n || k).toLowerCase();
        if ((k.indexOf(such) >= 0 || n.indexOf(such) >= 0) && !l.some(function (x) { return String(x.n).toLowerCase() === k; })) extra.push(k);
      });
      extra.forEach(function (k) { h += '<div class="zeile"' + dl(k) + '><div class="r">👤</div><div class="n">' + person(k) + '</div><div class="w profil-link">Profil ›</div></div>'; });
    }
    if (!h) h = '<div class="leer">' + (such ? 'Niemand mit diesem Namen gefunden.' : 'Noch keine Daten.') + '</div>';
    $('liste').innerHTML = h;
    $('hinweis').textContent = reiter === 'chat' && daten.chatGesamt ? 'Insgesamt ' + Number(daten.chatGesamt).toLocaleString('de-DE') + ' Chat-Nachrichten · gezählt von StreamElements' : 'Top ' + l.length;
  }

  $('reiter').onclick = function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    reiter = b.getAttribute('data-r');
    Array.prototype.forEach.call(this.children, function (x) { x.className = x === b ? 'aktiv' : ''; });
    try { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } catch (x) { }
    zeigen();
  };
  $('suche').oninput = zeigen;

  fetch('daten.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    daten = d;
    $('stand').textContent = 'Stand: ' + (d.stand || '–');
    if (d.live && d.live.an) {
      $('live').innerHTML = '<div class="punkt"></div><div class="txt"><b>Kaze ist gerade live' + (d.live.spiel ? ' · ' + esc(d.live.spiel) : '') + '</b><span>' + esc(d.live.titel || '') + '</span></div><div class="los">Zuschauen</div>';
      $('live').style.display = 'flex';
    }
    zeigen();
    var m = location.hash.match(/^#profil=(.+)$/);
    if (m) profilZeigen(decodeURIComponent(m[1]).toLowerCase());
  }).catch(function () { $('liste').innerHTML = '<div class="leer">Rangliste konnte nicht geladen werden.</div>'; });
})();
</script>
</body>
</html>
