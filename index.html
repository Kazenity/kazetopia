<style>
  :root {
    --bg: #180a1c; --flaeche: #26142c; --hover: #321c3a; --rand: #462c50;
    --rosa: #ff9ebf; --rosa2: #c2396f; --lila: #6a2c8c; --hell: #f6ecf6; --grau: #a892af; --dunkel: #280c22;
    --gold: #ffd27a; --silber: #dfe3ef; --bronze: #f0a774;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: Poppins, "Segoe UI", sans-serif; color: var(--hell); background: radial-gradient(1200px 500px at 50% -120px, rgba(194,57,111,.35), transparent 70%), var(--bg); min-height: 100vh; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 32px 16px 48px; }

  header { text-align: center; margin-bottom: 26px; }
  header .kl { font-size: 12px; font-weight: 700; letter-spacing: 3px; color: var(--rosa); }
  header h1 { font-size: clamp(30px, 7vw, 46px); font-weight: 800; line-height: 1.1; margin: 6px 0 8px; }
  header h1 span { color: var(--rosa); }
  header p { color: var(--grau); font-size: 14px; }
  header a { color: var(--rosa); text-decoration: none; font-weight: 700; }

  .reiter { display: flex; gap: 6px; background: var(--flaeche); padding: 5px; border-radius: 14px; margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .reiter::-webkit-scrollbar { display: none; }
  .reiter button { flex: 1 0 auto; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--hell); background: transparent; border: 0; border-radius: 10px; padding: 11px 9px; cursor: pointer; white-space: nowrap; }
  .reiter button:hover { background: var(--hover); }
  .reiter button.aktiv { background: var(--rosa); color: var(--dunkel); }

  .podest { display: grid; grid-template-columns: 1fr 1.15fr 1fr; gap: 10px; align-items: end; margin-bottom: 22px; }
  .platz { background: var(--flaeche); border-radius: 16px; padding: 16px 10px 14px; text-align: center; position: relative; min-width: 0; }
  .platz.p1 { padding-top: 26px; background: linear-gradient(160deg, #c2396f, #5a2562); box-shadow: 0 10px 30px rgba(194,57,111,.35); }
  .platz .m { font-size: 24px; line-height: 1; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); }
  .platz { margin-top: 12px; }
  .platz .n { font-weight: 800; font-size: 15px; margin-top: 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .platz.p1 .n { font-size: 17px; }
  .platz .w { font-size: 13px; color: var(--grau); margin-top: 2px; }
  .platz.p1 .w { color: #ffd9e6; }

  .av { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; flex: 0 0 auto; background: var(--lila); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: var(--hell); }
  .platz .av { width: 56px; height: 56px; font-size: 22px; margin: 8px auto 0; border: 3px solid var(--rand); display: flex; }
  .platz.p1 .av { width: 70px; height: 70px; border-color: var(--gold); }
  .platz.p2 .av { border-color: var(--silber); }
  .platz.p3 .av { border-color: var(--bronze); }
  .person { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .person span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .danke .av { width: 26px; height: 26px; font-size: 11px; }
  .danke .p { display: flex; align-items: center; gap: 8px; }
  .danke .p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bingo .zeile .w { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .bingo .av { width: 26px; height: 26px; font-size: 11px; }
  .suche { width: 100%; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--hell); background: var(--flaeche); border: 1px solid var(--rand); border-radius: 12px; padding: 11px 14px; outline: none; margin-bottom: 10px; }
  .suche:focus { border-color: var(--rosa); }

  .liste { background: var(--flaeche); border-radius: 16px; padding: 4px 14px; }
  .zeile { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rand); }
  .zeile:last-child { border-bottom: 0; }
  .zeile .r { font-weight: 800; color: var(--grau); }
  .zeile .n { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .zeile .w { font-weight: 700; color: var(--rosa); white-space: nowrap; }
  .zeile.treffer { background: rgba(255,158,191,.12); border-radius: 10px; margin: 0 -8px; padding: 10px 8px; }
  .leer { color: var(--grau); text-align: center; padding: 22px 0; }

  .bingo .zeile { grid-template-columns: 1fr auto; }
  .bingo .zeile .n { color: var(--grau); font-weight: 600; }
  .bingo .zeile .w { color: var(--hell); }
  .bingo .zeile.neu .w { color: var(--gold); }
  .serie { background: linear-gradient(135deg, #c2396f, #5a2562); border-radius: 16px; padding: 16px; text-align: center; margin-bottom: 12px; }
  .serie b { font-size: 20px; font-weight: 800; display: block; }
  .serie span { font-size: 13px; color: #ffd9e6; }
  .danke { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .danke .box { background: var(--flaeche); border-radius: 16px; padding: 14px; min-width: 0; }
  .danke h3 { font-size: 13px; letter-spacing: 1px; color: var(--rosa); margin-bottom: 8px; }
  .danke .p { padding: 6px 0; border-bottom: 1px solid var(--rand); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .danke .p:last-child { border-bottom: 0; }
  .danke .p i { font-style: normal; color: var(--grau); min-width: 24px; flex: 0 0 auto; }
  .danke-text { text-align: center; color: var(--grau); font-size: 14px; margin-bottom: 14px; }
  .live { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #c2396f, #5a2562); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; color: var(--hell); text-decoration: none; box-shadow: 0 8px 24px rgba(194,57,111,.3); }
  .live .punkt { width: 10px; height: 10px; border-radius: 50%; background: #ff3b5c; flex: 0 0 auto; animation: puls 1.4s infinite; }
  @keyframes puls { 0%,100% { box-shadow: 0 0 0 0 rgba(255,59,92,.7); } 50% { box-shadow: 0 0 0 7px rgba(255,59,92,0); } }
  .live .txt { min-width: 0; flex: 1; }
  .live b { display: block; font-size: 14px; }
  .live span { display: block; font-size: 12px; color: #ffd9e6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .live .los { font-size: 12px; font-weight: 800; background: var(--hell); color: var(--dunkel); border-radius: 8px; padding: 6px 10px; white-space: nowrap; }

  .kacheln { display: grid; gap: 10px; }
  .emotes { grid-template-columns: repeat(5, 1fr); }
  .emote { background: var(--flaeche); border-radius: 16px; padding: 14px 8px 12px; text-align: center; position: relative; min-width: 0; }
  .emote.e1 { background: linear-gradient(160deg, #c2396f, #5a2562); }
  .emote img { width: 64px; height: 64px; object-fit: contain; display: block; margin: 4px auto 8px; }
  .emote .rg { position: absolute; top: 8px; left: 10px; font-size: 12px; font-weight: 800; color: var(--grau); }
  .emote.e1 .rg { color: #ffd9e6; }
  .emote .n { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .emote .w { font-size: 12px; color: var(--rosa); font-weight: 700; }
  .emote.e1 .w { color: #ffd9e6; }

  .clips { grid-template-columns: repeat(3, 1fr); }
  .schalter { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
  .schalter button { font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--hell); background: var(--flaeche); border: 1px solid var(--rand); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .schalter button.aktiv { background: var(--rosa); color: var(--dunkel); border-color: var(--rosa); }
  .emotes.top3 { grid-template-columns: 1fr 1.15fr 1fr; align-items: end; margin-bottom: 10px; }
  .emotes.top3 .emote img { width: 84px; height: 84px; }
  .emotes.top3 .emote.e1 img { width: 104px; height: 104px; }
  .emotes.top3 .emote .n { font-size: 14px; }
  .emotes.top3 .emote .w { font-size: 13px; }
  .emotes.rest { grid-template-columns: repeat(6, 1fr); }
  .emotes.rest .emote { padding: 10px 6px 8px; border-radius: 12px; }
  .emotes.rest .emote img { width: 44px; height: 44px; margin: 6px auto 6px; }
  .emotes.rest .emote .rg { top: 6px; left: 8px; font-size: 10.5px; }
  .emotes.rest .emote .n { font-size: 10.5px; }
  .emotes.rest .emote .w { font-size: 11px; }
  .spiel .rt { display: inline-block; margin-top: 3px; font-size: 13px; font-weight: 800; color: var(--gold); }
  .spiel .rt.laeuft { color: var(--rosa); }
  .clip { background: var(--flaeche); border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--hell); display: block; min-width: 0; transition: transform .15s; }
  .clip:hover { transform: translateY(-2px); background: var(--hover); }
  .clip .vb { position: relative; aspect-ratio: 16 / 9; background: var(--dunkel); }
  .clip .vb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip .vb i { position: absolute; left: 8px; top: 8px; font-style: normal; font-size: 11px; font-weight: 800; background: rgba(0,0,0,.65); border-radius: 6px; padding: 2px 7px; }
  .clip .vb u { position: absolute; right: 8px; bottom: 8px; text-decoration: none; font-size: 11px; font-weight: 700; background: rgba(0,0,0,.65); border-radius: 6px; padding: 2px 7px; }
  .clip .t { padding: 9px 11px 11px; }
  .clip .t b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clip .t span { font-size: 11.5px; color: var(--grau); }

  .spiele { grid-template-columns: repeat(4, 1fr); }
  .spiel { background: var(--flaeche); border-radius: 14px; overflow: hidden; min-width: 0; position: relative; }
  .spiel .cv { aspect-ratio: 3 / 4; background: var(--dunkel); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .spiel .cv img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .spiel .t { padding: 8px 10px 10px; }
  .spiel .t b { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .spiel .t span { font-size: 11.5px; color: var(--grau); }
  .spiel .yt { display: inline-block; margin-top: 6px; font-size: 11px; font-weight: 800; color: var(--dunkel); background: var(--rosa); border-radius: 7px; padding: 3px 8px; text-decoration: none; }
  .spiel .lv { position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 800; background: #ff3b5c; color: #fff; border-radius: 6px; padding: 2px 7px; }
  .socials { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 26px; }
  .socials a { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--hell); text-decoration: none; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 999px; padding: 8px 14px; }
  .socials a:hover { border-color: var(--rosa); color: var(--rosa); }
  .socials svg { width: 16px; height: 16px; fill: currentColor; }
  footer { text-align: center; color: var(--grau); font-size: 12px; margin-top: 22px; line-height: 1.7; }
  [data-l] { cursor: pointer; }
  .zeile[data-l]:hover, .danke .p[data-l]:hover { background: rgba(255,158,191,.07); border-radius: 10px; }
  .karte-bg { position: fixed; inset: 0; background: rgba(10,4,12,.72); backdrop-filter: blur(4px); display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; z-index: 50; }
  .karte-bg.offen { display: flex; }
  .karte { width: 100%; max-width: 460px; background: var(--flaeche); border: 1px solid var(--rand); border-radius: 20px; padding: 22px 20px 18px; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  .karte .zu { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--grau); font-size: 24px; cursor: pointer; line-height: 1; }
  .karte .kopf { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
  .karte .kopf .av { width: 72px; height: 72px; font-size: 28px; border: 3px solid var(--rosa); }
  .karte .kopf b { display: block; font-size: 20px; font-weight: 800; }
  .karte .rang { display: inline-block; margin-top: 4px; font-size: 14px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: linear-gradient(135deg, #c2396f, #5a2562); }
  .karte .kk { margin-top: 5px; font-size: 13px; color: var(--grau); font-weight: 600; }
  .karte .kk b { display: inline; font-size: 13px; color: var(--gold); }
  .karte h4 { font-size: 12px; letter-spacing: 1.5px; color: var(--rosa); margin: 16px 0 8px; }
  .erfolg { background: var(--bg); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
  .erfolg .ob { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; font-weight: 700; }
  .erfolg .ob span { color: var(--grau); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
  .erfolg .balken { height: 7px; border-radius: 99px; background: var(--rand); margin-top: 8px; overflow: hidden; }
  .erfolg .balken i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--rosa2), var(--rosa)); }
  .erfolg .un { font-size: 11.5px; color: var(--grau); margin-top: 5px; }
  .erfolg.max .balken i { background: linear-gradient(90deg, #f0c060, var(--gold)); }
  .abz { display: flex; flex-wrap: wrap; gap: 6px; }
  .abz span { font-size: 12.5px; font-weight: 700; background: var(--bg); border: 1px solid var(--rand); border-radius: 999px; padding: 5px 10px; }
  .abz span.aus { opacity: .35; }
  .ms { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .ms span { font-size: 11px; font-weight: 800; color: var(--gold); background: rgba(255,210,122,.1); border-radius: 6px; padding: 2px 6px; }
  .profil-link { color: var(--rosa); font-weight: 700; }
  @media (max-width: 560px) {
    .danke { grid-template-columns: 1fr; }
    .emotes.rest { grid-template-columns: repeat(4, 1fr); }
    .emotes.top3 .emote img { width: 60px; height: 60px; } .emotes.top3 .emote.e1 img { width: 76px; height: 76px; }
    .emotes.top3 .emote .n { font-size: 11.5px; }
    .clips { grid-template-columns: 1fr 1fr; }
    .spiele { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 380px) {
    .clips { grid-template-columns: 1fr; }
  }
  @media (max-width: 480px) {
    .podest { gap: 6px; }
    .platz { padding: 12px 6px 10px; }
    .platz .n { font-size: 13px; } .platz.p1 .n { font-size: 14px; }
    .platz .w { font-size: 11.5px; }
    .platz .av { width: 46px; height: 46px; } .platz.p1 .av { width: 56px; height: 56px; }
    .av { width: 30px; height: 30px; }
  }
</style>

  <footer>
    <div id="stand"></div>
    <div id="hinweis"></div>
    <div>Klick auf einen Namen für Rang &amp; Erfolge · Wird während der Streams alle 10 Minuten aktualisiert.</div>
  </footer>
</div>

<div class="karte-bg" id="kartebg"><div class="karte" id="karte"></div></div>

<script>
(function () {
  var daten = null, reiter = 'zeni', clipZeit = 'monat';
  var $ = function (id) { return document.getElementById(id); };
  function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function prof(n) {
    var l = String(n || '').toLowerCase();
    var p = daten && daten.profile ? daten.profile[l] : null;
    var sp = daten && daten.spieler ? daten.spieler[l] : null;
    return { n: p && p.n ? p.n : (sp && sp.n ? sp.n : n), b: p && p.b ? p.b : '' };
  }
  function dl(n) { return ' data-l="' + esc(String(n || '').toLowerCase()) + '"'; }
  function bild(n, gross) {
    var p = prof(n);
    var buchstabe = esc(String(p.n || '?').charAt(0).toUpperCase());
    if (!p.b) return '<span class="av">' + buchstabe + '</span>';
    return '<img class="av" loading="lazy" alt="" src="' + esc(p.b.replace('300x300', gross ? '150x150' : '70x70')) + '" onerror="this.outerHTML=\'<span class=&quot;av&quot;>' + buchstabe + '</span>\'">';
  }
  function person(n) { return '<div class="person">' + bild(n) + '<span>' + esc(prof(n).n) + '</span></div>'; }

  // ================= ERFOLGE =================
  // Hauptrang: Watchtime als Dragon-Ball-Leiter
  var RAENGE = [
    [1, '🧑', 'Erdling'], [5, '🥋', 'Kampfschüler'], [10, '🐢', 'Kame-Schüler'], [25, '🏟️', 'Budokai-Kämpfer'],
    [50, '🐒', 'Saiyajin'], [75, '🌕', 'Oozaru'], [100, '🔥', 'Kaioken'], [150, '🔵', 'Genkidama-Meister'],
    [200, '💛', 'Super-Saiyajin'], [250, '💛', 'Super-Saiyajin 2'], [300, '💛', 'Super-Saiyajin 3'], [400, '🐉', 'Super-Saiyajin 4'],
    [500, '❤️', 'Super-Saiyajin God'], [650, '💙', 'Super-Saiyajin Blue'], [800, '💙', 'Blue Kaioken'], [1000, '🪄', 'Whis-Schüler'],
    [1250, '🏟️', 'Turnier der Kraft · Teilnehmer'], [1500, '🤍', 'Ultra Instinct Omen'], [1750, '🏟️', 'Turnier der Kraft · Finalist'],
    [2000, '🤍', 'Ultra Instinct'], [2250, '💜', 'Ultra Ego'], [2500, '🔴', 'Beast'], [2750, '💥', 'Hakai-Meister'],
    [3000, '🐈', 'Anwärter Gott der Zerstörung'], [3250, '🐈', 'Gott der Zerstörung'], [4000, '👼', 'Engel'],
    [5000, '🌌', 'Großpriester'], [6000, '👑', 'Zeno – Allkönig']
  ];
  function rangVon(h) { var r = null; RAENGE.forEach(function (x) { if (h >= x[0]) r = x; }); return r; }
  function naechsterRang(h) { for (var i = 0; i < RAENGE.length; i++) if (RAENGE[i][0] > h) return RAENGE[i]; return null; }

  // Stufen der anderen Erfolge: feste Liste, danach endlos im gleichen Abstand
  var ERFOLGE = [
    { k: 'c', icon: '💬', name: 'Plaudertasche', einheit: 'Nachrichten', stufen: [10, 50, 100, 250, 500, 750, 1000, 1500, 2000, 3000, 4000, 5000, 7500, 10000], dann: 2500 },
    { k: 'f', icon: '🌸', name: 'Treue', einheit: 'Tage Follower', stufen: [7, 30, 90, 180, 365], dann: 365, tage: true },
    { k: 's', icon: '⭐', name: 'Sub-Treue', einheit: 'Sub-Monate', stufen: [1, 3, 6, 9, 12, 18, 24, 30, 36], dann: 12 },
    { k: 'z', icon: '💰', name: 'Zeni-Rekord', einheit: 'Zeni', stufen: [1000, 5000, 10000, 25000, 50000, 100000, 150000, 250000, 500000, 750000, 1000000], dann: 500000 },
    { k: 'b', icon: '🎯', name: 'Bingo-Sieger', einheit: 'Monatssiege', stufen: [1, 3, 6, 12], dann: 12 },
    { k: 'k', icon: '🎬', name: 'Regisseur', einheit: 'Clips', stufen: [1, 5, 10, 25, 50], dann: 50 }
  ];
  function stufeInfo(e, wertV) {
    var st = e.stufen.slice(), letzte = st[st.length - 1];
    while (letzte <= wertV) { letzte += e.dann; st.push(letzte); }   // endlos verlängern
    var erreicht = 0, ziel = st[0], vorher = 0;
    for (var i = 0; i < st.length; i++) { if (wertV >= st[i]) { erreicht = i + 1; vorher = st[i]; } else { ziel = st[i]; break; } }
    return { stufe: erreicht, ziel: ziel, vorher: vorher };
  }
  function zahl(v) { return Number(v).toLocaleString('de-DE', { maximumFractionDigits: 1 }); }
  function tageSeit(d) { var t = Date.parse(d); return isNaN(t) ? 0 : Math.floor((Date.now() - t) / 86400000); }

  function profilZeigen(login) {
    if (!daten) return;
    var sp = (daten.spieler || {})[login];
    var p = prof(login);
    var name = p.n || login;
    var h = '<button class="zu" id="zu" aria-label="Schließen">×</button>';
    if (!sp) {
      h += '<div class="kopf">' + bild(login, true) + '<div><b>' + esc(name) + '</b><div class="kk">Noch keine Erfolge – einfach im Stream vorbeischauen 🌸</div></div></div>';
    } else {
      var std = sp.w || 0, r = rangVon(std), nx = naechsterRang(std), kk = Math.floor(std * 10);
      var platz = 0; (daten.watchtime || []).forEach(function (x, i) { if (String(x.n).toLowerCase() === login) platz = i + 1; });
      h += '<div class="kopf">' + bild(login, true) + '<div><b>' + esc(name) + '</b>' +
        (r ? '<div class="rang">' + r[1] + ' ' + esc(r[2]) + '</div>' : '') +
        '<div class="kk">⚡ Kampfkraft <b>' + zahl(kk) + '</b>' + (kk > 9000 ? ' · über 9000!' : '') + '</div></div></div>';

      // Hauptrang
      h += '<h4>⏱️ WATCHTIME · ' + zahl(std) + ' STD.' + (platz ? ' · PLATZ ' + platz : '') + '</h4>';
      if (nx) {
        var von = r ? r[0] : 0, proz = Math.max(2, Math.min(100, (std - von) / (nx[0] - von) * 100));
        h += '<div class="erfolg"><div class="ob">Nächster Rang: ' + nx[1] + ' ' + esc(nx[2]) + '<span>ab ' + zahl(nx[0]) + ' Std.</span></div>' +
          '<div class="balken"><i style="width:' + proz + '%"></i></div><div class="un">noch ' + zahl(Math.ceil((nx[0] - std) * 10) / 10) + ' Std.</div></div>';
      } else {
        var naechsteKK = (Math.floor(kk / 10000) + 1) * 10000, proz2 = Math.max(2, (kk % 10000) / 100);
        h += '<div class="erfolg max"><div class="ob">✦ Höchster Rang erreicht ✦<span>nächster Meilenstein ' + zahl(naechsteKK) + '</span></div>' +
          '<div class="balken"><i style="width:' + proz2 + '%"></i></div><div class="un">noch ' + zahl((naechsteKK - kk) / 10) + ' Std.</div></div>';
      }
      if (kk >= 9000) {
        h += '<div class="ms">'; h += '<span>9.000 · über 9000!</span>';
        for (var m = 10000; m <= kk; m += 10000) h += '<span>' + zahl(m) + '</span>';
        h += '</div>';
      }

      // weitere Erfolge
      h += '<h4>🏅 ERFOLGE</h4>';
      ERFOLGE.forEach(function (e) {
        var v = e.tage ? (sp.f ? tageSeit(sp.f) : 0) : (sp[e.k] || 0);
        if (!v && (e.k === 'b' || e.k === 'k')) return;   // Bingo/Clips nur zeigen, wenn schon etwas da ist
        var s = stufeInfo(e, v);
        var proz = Math.max(2, Math.min(100, (v - s.vorher) / (s.ziel - s.vorher) * 100));
        var anzeige = e.tage ? (v >= 365 ? zahl(Math.floor(v / 365 * 10) / 10) + ' Jahre' : v + ' Tage') : zahl(v) + ' ' + e.einheit;
        h += '<div class="erfolg"><div class="ob">' + e.icon + ' ' + e.name + (s.stufe ? ' · Stufe ' + s.stufe : '') + '<span>' + anzeige + '</span></div>' +
          '<div class="balken"><i style="width:' + proz + '%"></i></div><div class="un">nächste Stufe bei ' + (e.tage ? (s.ziel >= 365 ? zahl(s.ziel / 365) + ' Jahren' : s.ziel + ' Tagen') : zahl(s.ziel) + ' ' + e.einheit) + '</div></div>';
      });

      // Abzeichen
      var abz = [
        // OG: mind. 2 Jahre Follower + 500 Std. Watchtime – oder ab 1.000 Std. immer (falls das Follow-Datum fehlt)
        [((sp.f && tageSeit(sp.f) >= 730 && (sp.w || 0) >= 500) || (sp.w || 0) >= 1000), '👑 OG'],
        [sp.u, '💜 Unterstützer'], [sp.f && sp.f < '2020', '🌱 Day One'], [sp.g, '🎂 Geburtstagskind'],
        [sp.t, '🏆 Top 10'], [sp.x, '⚔️ Saber-Bezwinger']
      ];
      h += '<h4>✨ ABZEICHEN</h4><div class="abz">';
      abz.forEach(function (a) { h += '<span' + (a[0] ? '' : ' class="aus"') + '>' + a[1] + '</span>'; });
      h += '</div>';
    }
    $('karte').innerHTML = h;
    $('kartebg').className = 'karte-bg offen';
    $('zu').onclick = profilZu;
  }
  function profilZu() { $('kartebg').className = 'karte-bg'; }
  $('kartebg').onclick = function (e) { if (e.target === this) profilZu(); };
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') profilZu(); });
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-l]');
    if (!t || t.closest('#karte')) return;
    profilZeigen(t.getAttribute('data-l'));
  });
  function wert(w) {
    if (reiter === 'watchtime') return Number(w).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Std.';
    if (reiter === 'chat') return Number(w).toLocaleString('de-DE') + ' Nachr.';
    return Number(w).toLocaleString('de-DE') + ' Zeni';
  }

  function sonder() {
    var spezial = reiter === 'bingo' || reiter === 'danke' || reiter === 'emotes' || reiter === 'clips' || reiter === 'spiele';
    $('podest').style.display = spezial ? 'none' : '';
    $('suche').style.display = spezial ? 'none' : '';
    if (!spezial) { $('liste').className = 'liste'; return false; }
    if (reiter === 'emotes') {
      var em = daten.emotes || [];
      var he = '';
      function kachel(x, i) {
        return '<div class="emote' + (i === 0 ? ' e1' : '') + '"><div class="rg">' + (i < 3 ? ['🥇', '🥈', '🥉'][i] : '#' + (i + 1)) + '</div><img loading="lazy" alt="' + esc(x.n) + '" src="' + esc(x.b) + '"><div class="n">' + esc(x.n) + '</div><div class="w">' + Number(x.w).toLocaleString('de-DE') + '×</div></div>';
      }
      if (em.length) {
        he += '<div class="kacheln emotes top3">';
        [1, 0, 2].forEach(function (i) { he += em[i] ? kachel(em[i], i) : '<div></div>'; });
        he += '</div>';
        if (em.length > 3) {
          he += '<div class="kacheln emotes rest">';
          for (var k = 3; k < em.length; k++) he += kachel(em[k], k);
          he += '</div>';
        }
      }
      $('liste').className = '';
      $('liste').innerHTML = em.length ? he : '<div class="liste"><div class="leer">Noch keine Emote-Daten.</div></div>';
      $('hinweis').textContent = 'Alle ' + em.length + ' Kanal-Emotes, sortiert nach Beliebtheit im Chat';
      return true;
    }
    if (reiter === 'clips') {
      var c = daten.clips || {};
      var hc = '';
      if (c.woche) hc += '<div class="serie"><b>🎬 Clipper der Woche: ' + esc(prof(c.woche.name).n) + '</b><span>' + c.woche.anzahl + (c.woche.anzahl == 1 ? ' Clip' : ' Clips') + ' seit Sonntag, ' + esc(c.woche.seit) + ' · Clippt mit !clip mit!</span></div>';
      var zeitraeume = [['woche', 'Diese Woche', c.wocheTop], ['monat', 'Letzte 30 Tage', c.monat], ['top', 'Alle Zeiten', c.top]];
      hc += '<div class="schalter" id="schalter">';
      zeitraeume.forEach(function (z) { hc += '<button data-z="' + z[0] + '"' + (z[0] === clipZeit ? ' class="aktiv"' : '') + '>' + z[1] + '</button>'; });
      hc += '</div>';
      var tc = (clipZeit === 'woche' ? c.wocheTop : clipZeit === 'top' ? c.top : c.monat) || [];
      if (tc.length) {
        hc += '<div class="kacheln clips">';
        tc.forEach(function (x, i) {
          hc += '<a class="clip" href="' + esc(x.url) + '" target="_blank" rel="noopener"><div class="vb"><img loading="lazy" alt="" src="' + esc(x.bild) + '"><i>#' + (i + 1) + '</i><u>▶ ' + Number(x.aufrufe).toLocaleString('de-DE') + '</u></div><div class="t"><b>' + esc(x.titel) + '</b><span>von ' + esc(prof(x.von).n) + (x.datum ? ' · ' + esc(x.datum) : '') + '</span></div></a>';
        });
        hc += '</div>';
      } else hc += '<div class="liste"><div class="leer">In diesem Zeitraum gibt es noch keine Clips.</div></div>';
      $('liste').className = '';
      $('liste').innerHTML = hc;
      $('schalter').onclick = function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        clipZeit = b.getAttribute('data-z');
        zeigen();
      };
      $('hinweis').textContent = 'Die meistgesehenen Clips · ' + (clipZeit === 'woche' ? 'seit Sonntag' : clipZeit === 'top' ? 'aller Zeiten' : 'der letzten 30 Tage');
      return true;
    }
    if (reiter === 'spiele') {
      var sp = daten.spiele || [];
      var hs = '';
      sp.forEach(function (x) {
        hs += '<div class="spiel">' + (x.live ? '<div class="lv">● LIVE</div>' : '') + '<div class="cv">' + (x.b ? '<img loading="lazy" alt="" src="' + esc(x.b) + '">' : '🎮') + '</div><div class="t"><b title="' + esc(x.n) + '">' + esc(x.n) + '</b>' + (x.r ? '<span class="rt">⭐ ' + esc(x.r) + '</span>' : '<span class="rt laeuft">▶ Läuft gerade</span>') + (x.link ? '<br><a class="yt" href="' + esc(x.link) + '" target="_blank" rel="noopener">▶ YouTube</a>' : '') + '</div></div>';
      });
      $('liste').className = '';
      $('liste').innerHTML = sp.length ? '<div class="kacheln spiele">' + hs + '</div>' : '<div class="liste"><div class="leer">Noch keine Spiele eingetragen.</div></div>';
      $('hinweis').textContent = 'Unsere Story-Games mit Kazes Bewertung';
      return true;
    }
    if (reiter === 'bingo') {
      var b = daten.bingo || [];
      var h = '';
      if (b.length) {
        var serie = 1;
        for (var i = 1; i < b.length && b[i].name === b[0].name; i++) serie++;
        if (serie >= 2) h += '<div class="serie"><b>👑 ' + esc(b[0].name) + '</b><span>gewinnt das Bingo ' + serie + ' Monate in Folge · Wer schlägt ' + esc(b[0].name) + '?</span></div>';
      }
      h += '<div class="liste">';
      if (!b.length) h += '<div class="leer">Noch keine Bingo-Gewinner eingetragen.</div>';
      b.forEach(function (x, i) { h += '<div class="zeile' + (i === 0 ? ' neu' : '') + '"' + dl(x.name) + '><div class="n">' + esc(x.monat) + '</div><div class="w">' + (i === 0 ? '🏆 ' : '') + bild(x.name) + '<span>' + esc(prof(x.name).n) + '</span></div></div>'; });
      h += '</div>';
      $('liste').className = 'bingo';
      $('liste').innerHTML = h;
      $('hinweis').textContent = 'Jeden Monat Stream-Bingo mitspielen – der Gewinner landet hier.';
    } else {
      var d = daten.danke || {};
      function spalte(t, arr) {
        var s = '<div class="box"><h3>' + t + '</h3>';
        if (!arr || !arr.length) s += '<div class="leer">–</div>';
        (arr || []).forEach(function (n, i) { s += '<div class="p"' + dl(n) + '><i>' + (i + 1) + '.</i>' + bild(n) + '<span>' + esc(prof(n).n) + '</span></div>'; });
        return s + '</div>';
      }
      $('liste').className = '';
      $('liste').innerHTML = '<div class="danke-text">Danke an alle, die den Kanal unterstützen 🌸</div><div class="danke">' +
        spalte('💸 SPENDEN', d.spenden) + spalte('🎁 GIFT SUBS', d.gifts) + spalte('🔔 BITS', d.bits) + '</div>';
      $('hinweis').textContent = 'Die größten Unterstützer aller Zeiten';
    }
    return true;
  }

  var untertitel = {
    zeni: 'Wer hat die meisten Zeni?',
    watchtime: 'Wer schaut am längsten zu?',
    bingo: 'Wer hat das Stream-Bingo gewonnen?',
    chat: 'Wer schreibt am meisten im Chat?',
    danke: 'Die größten Unterstützer des Kanals',
    emotes: 'Welche Emotes lieben wir am meisten?',
    clips: 'Die besten Momente aus dem Stream',
    spiele: 'Welche Story-Games haben wir schon gespielt?'
  };
  function zeigen() {
    $('unter').textContent = untertitel[reiter] || '';
    if (!daten) return;
    if (sonder()) return;
    var l = daten[reiter] || [];
    var such = $('suche').value.trim().toLowerCase();
    var medaillen = ['🥇', '🥈', '🥉'];
    var reihen = [1, 0, 2];
    var p = '';
    reihen.forEach(function (i) {
      var x = l[i];
      if (!x) { p += '<div></div>'; return; }
      p += '<div class="platz p' + (i + 1) + '"' + dl(x.n) + '><div class="m">' + medaillen[i] + '</div>' + bild(x.n, true) + '<div class="n">' + esc(prof(x.n).n) + '</div><div class="w">' + wert(x.w) + '</div></div>';
    });
    $('podest').innerHTML = p;

    var h = '', gefunden = 0;
    l.forEach(function (x, i) {
      if (i < 3 && !such) return;
      var treffer = such && (x.n.toLowerCase().indexOf(such) >= 0 || String(prof(x.n).n).toLowerCase().indexOf(such) >= 0);
      if (such && !treffer) return;
      gefunden++;
      h += '<div class="zeile' + (treffer ? ' treffer' : '') + '"' + dl(x.n) + '><div class="r">#' + (i + 1) + '</div><div class="n">' + person(x.n) + '</div><div class="w">' + wert(x.w) + '</div></div>';
    });
    if (such && daten.spieler) {
      // Profile auch für Leute außerhalb der Top 100 finden
      var extra = [];
      Object.keys(daten.spieler).forEach(function (k) {
        if (extra.length >= 8) return;
        var n = String(prof(k).n || k).toLowerCase();
        if ((k.indexOf(such) >= 0 || n.indexOf(such) >= 0) && !l.some(function (x) { return String(x.n).toLowerCase() === k; })) extra.push(k);
      });
      extra.forEach(function (k) { h += '<div class="zeile"' + dl(k) + '><div class="r">👤</div><div class="n">' + person(k) + '</div><div class="w profil-link">Profil ›</div></div>'; });
    }
    if (!h) h = '<div class="leer">' + (such ? 'Niemand mit diesem Namen gefunden.' : 'Noch keine Daten.') + '</div>';
    $('liste').innerHTML = h;
    $('hinweis').textContent = reiter === 'chat' && daten.chatGesamt ? 'Insgesamt ' + Number(daten.chatGesamt).toLocaleString('de-DE') + ' Chat-Nachrichten · gezählt von StreamElements' : 'Top ' + l.length;
  }

  $('reiter').onclick = function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    reiter = b.getAttribute('data-r');
    Array.prototype.forEach.call(this.children, function (x) { x.className = x === b ? 'aktiv' : ''; });
    try { b.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' }); } catch (x) { }
    zeigen();
  };
  $('suche').oninput = zeigen;

  fetch('daten.json?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    daten = d;
    $('stand').textContent = 'Stand: ' + (d.stand || '–');
    if (d.live && d.live.an) {
      $('live').innerHTML = '<div class="punkt"></div><div class="txt"><b>Kaze ist gerade live' + (d.live.spiel ? ' · ' + esc(d.live.spiel) : '') + '</b><span>' + esc(d.live.titel || '') + '</span></div><div class="los">Zuschauen</div>';
      $('live').style.display = 'flex';
    }
    zeigen();
    var m = location.hash.match(/^#profil=(.+)$/);
    if (m) profilZeigen(decodeURIComponent(m[1]).toLowerCase());
  }).catch(function () { $('liste').innerHTML = '<div class="leer">Rangliste konnte nicht geladen werden.</div>'; });
})();
</script>
</body>
</html>
